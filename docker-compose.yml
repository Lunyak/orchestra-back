services:
  postgres:
    image: postgres:16-alpine
    container_name: orkestr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orkestr
      POSTGRES_PASSWORD: orkestr_secret
      POSTGRES_DB: dophamin_orkestr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkestr -d dophamin_orkestr"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: orkestr-back
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-admin-secret}
      # S3/MinIO storage (variant A)
      # Backend и браузер ходят к MinIO по одному и тому же адресу,
      # чтобы пресайнд-URL работали без переподписывания.
      S3_ENDPOINT: http://213.226.126.196:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: orchestra
      S3_SECRET_KEY: orchestra_secret
      S3_BUCKET: orchestra-media
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: orkestr-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      back:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: orkestr-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      back:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: orkestr-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: orchestra
      MINIO_ROOT_PASSWORD: orchestra_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

  dozzle:
    image: amir20/dozzle:latest
    container_name: orkestr-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300

volumes:
  postgres_data:
  minio_data:
