services:
  postgres:
    image: postgres:16-alpine
    container_name: orkestr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orkestr
      POSTGRES_PASSWORD: orkestr_secret
      POSTGRES_DB: dophamin_orkestr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkestr -d dophamin_orkestr"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: orkestr-back
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-admin-secret}
      # Telegram Bot
      BOT_TOKEN: ${BOT_TOKEN}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID}
      # Bot -> Backend auth (/bot/*)
      BOT_SECRET: ${BOT_SECRET}
      # Back -> Bot (internal publish)
      BOT_INTERNAL_URL: ${BOT_INTERNAL_URL:-http://bot:3001}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      BOT_TOKENS_KEY: ${BOT_TOKENS_KEY}
      # S3/MinIO storage (variant A)
      # Backend и браузер ходят к MinIO по одному и тому же адресу,
      # чтобы пресайнд-URL работали без переподписывания.
      # Внутри docker-сети лучше ходить по имени сервиса
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # А для ссылок, которые увидит браузер — внешний адрес MinIO
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://213.226.126.196:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-orchestra}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-orchestra_secret}
      S3_BUCKET: ${S3_BUCKET:-orchestra-media}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: orkestr-bot
    restart: unless-stopped
    environment:
      # Runner mode does not need a single BOT_TOKEN,
      # but keep it for legacy single-bot mode.
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Which TelegramBotIntegration (from Orchestra UI) this bot represents.
      # Required for backend /bot/* endpoints (guarded by X-Telegram-Bot-Integration-Id).
      TELEGRAM_BOT_INTEGRATION_ID: ${TELEGRAM_BOT_INTEGRATION_ID:-}
      # Single internal secret for server-to-server
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ADMIN_ID: ${OWNER_TELEGRAM_ID}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID}
      GROUP_CHAT_ID: ${GROUP_CHAT_ID}
      # message_thread_id (topics) — set explicitly if you want a specific topic
      GROUP_CHAT_ID_ATTENTION: ${GROUP_CHAT_ID_ATTENTION}
      # Optional: message_thread_id for director sessions публикаций
      DIRECTOR_SESSIONS_THREAD_ID: ${DIRECTOR_SESSIONS_THREAD_ID}
      ANNOUNCEMENTS_THREAD_ID: ${ANNOUNCEMENTS_THREAD_ID:-14434}
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      SERVER_URL: back:3000
      # Bot -> Backend auth (/bot/*)
      BOT_SECRET: ${BOT_SECRET}
      HEALTH_PORT: 3001
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_BASE_PATH: /orkestr/
    container_name: orkestr-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      back:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        WEB_DOMAIN: ${WEB_DOMAIN:-}
    container_name: orkestr-site
    restart: unless-stopped
    ports:
      - "8082:80"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_LINK_WEB_LOCAL: ${VITE_LINK_WEB_LOCAL:-http://localhost:5173}
        VITE_LINK_WEB_SERVER: ${VITE_LINK_WEB_SERVER:-http://213.226.126.196}
        VITE_LINK_MINIO: ${VITE_LINK_MINIO:-http://213.226.126.196:9001}
        VITE_LINK_DOZZLE: ${VITE_LINK_DOZZLE:-http://213.226.126.196:9999}
    container_name: orkestr-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      back:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: orkestr-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orchestra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orchestra_secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

  # Одноразовый init: поднялся → mc (alias, бакет, public read) → завершился с кодом 0. Не держится в Up — это норма (restart: "no").
  # Авто-создание бакета после (re)deploy, чтобы /files/upload не падал с 500
  # Без container_name: иначе после первого Exited нельзя снова `compose run` / пересоздать вручную (конфликт имён).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orchestra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orchestra_secret}
      S3_BUCKET: ${S3_BUCKET:-orchestra-media}
    # Один аргумент для sh -c: иначе compose режет multiline `command: >` на argv и теряет `&& ...`
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$S3_BUCKET" || true
        mc anonymous set download "local/$$S3_BUCKET" || true
    restart: "no"

  dozzle:
    image: amir20/dozzle:latest
    container_name: orkestr-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300

volumes:
  postgres_data:
  minio_data:
