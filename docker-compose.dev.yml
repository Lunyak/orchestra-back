# Локальная разработка с hot-reload (Docker / OrbStack: `docker compose` тот же CLI).
# Использование: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Продакшен на VPS: только docker-compose.yml (и при необходимости docker-compose.https.yml).

services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    volumes:
      - ./back/src:/app/src
      - ./back/prisma:/app/prisma
      - ./back/test:/app/test
      - ./back/tsconfig.json:/app/tsconfig.json
      - ./back/tsconfig.build.json:/app/tsconfig.build.json
      - ./back/nest-cli.json:/app/nest-cli.json
      - ./back/prisma.config.ts:/app/prisma.config.ts
      # Синхронизация манифеста с хостом + npm install при старте — иначе анонимный том
      # /app/node_modules залипает на старых пакетах после добавления зависимостей (без ручного docker volume rm).
      - ./back/package.json:/app/package.json
      - ./back/package-lock.json:/app/package-lock.json
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Пресайнд URL для браузера на хосте; внутри сети compose — minio:9000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port для Node.js
    command: sh -c "npm install --no-audit --fund=false && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    volumes:
      - ./web/src:/workspace/web/src
      - ./web/public:/workspace/web/public
      - ./web/index.html:/workspace/web/index.html
      - ./web/vite.config.ts:/workspace/web/vite.config.ts
      - ./web/vite-local-projects-plugin.ts:/workspace/web/vite-local-projects-plugin.ts
      - ./web/tsconfig.json:/workspace/web/tsconfig.json
      - ./web/tsconfig.node.json:/workspace/web/tsconfig.node.json
      - ./web/package.json:/workspace/web/package.json
      - ./web/package-lock.json:/workspace/web/package-lock.json
      - ./app/package.json:/workspace/app/package.json
      - ./app/package-lock.json:/workspace/app/package-lock.json
      - ./app/src:/workspace/app/src
      # Не монтируем тома на node_modules — иначе залипает старый кэш без новых пакетов.
    environment:
      # Браузер: тот же origin + /api. Прокси Vite (внутри контейнера): back:3000
      VITE_API_BASE_URL: /api
      DEV_PROXY_API: http://back:3000
      # npm install при старте: чуть терпимее к обрывам сети до registry
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    ports:
      - "5173:5173"
    depends_on:
      - back

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile.dev
    volumes:
      - ./admin/src:/workspace/admin/src
      - ./admin/public:/workspace/admin/public
      - ./admin/index.html:/workspace/admin/index.html
      - ./admin/vite.config.ts:/workspace/admin/vite.config.ts
      - ./admin/tsconfig.json:/workspace/admin/tsconfig.json
      - ./admin/tsconfig.node.json:/workspace/admin/tsconfig.node.json
      - ./app/src:/workspace/app/src
      - /workspace/admin/node_modules
      - /workspace/app/node_modules
    environment:
      VITE_API_BASE_URL: /api
      DEV_PROXY_API: http://back:3000
      VITE_MINIO_PROXY_TARGET: http://minio:9000
    ports:
      - "5174:5173"
    depends_on:
      - back

  site:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    volumes:
      - ./client/src:/workspace/client/src
      - ./client/public:/workspace/client/public
      - ./client/package.json:/workspace/client/package.json
      - ./client/package-lock.json:/workspace/client/package-lock.json
      - ./client/tsconfig.json:/workspace/client/tsconfig.json
      - /workspace/client/node_modules
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Браузер ходит на host:8082, HMR-сокет тоже через этот порт
      WDS_SOCKET_PORT: "8082"
      REACT_APP_API_BASE_URL: /api
      DEV_PROXY_API: http://back:3000
      DEV_PROXY_MINIO: http://minio:9000
    ports: !override
      - "8082:3000"
    depends_on:
      - back
      - minio
