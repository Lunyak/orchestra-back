# CI/CD для GitLab (сервер: API + БД). Клиент «Оркестр» — в отдельном репозитории.

stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DEP_PROXY: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
  NODE_IMAGE: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_VERSION}-alpine"
  POSTGRES_IMAGE: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:16-alpine"
  DEPLOY_HOST: "213.226.126.196"
  DEPLOY_REPO_SYNC: "cd /opt/orchestra-back && git fetch --all --prune && git reset --hard origin/${CI_DEFAULT_BRANCH} && git clean -fd"

# Кэш node_modules
default:
  tags:
    - orchestra
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - back/node_modules/

# Линт бэкенда
lint:back:
  stage: lint
  image: ${NODE_IMAGE}
  script:
    - cd back
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Тесты бэкенда
test:back:
  stage: test
  image: ${NODE_IMAGE}
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
    POSTGRES_DB: dophamin_orkestr
    POSTGRES_USER: orkestr
    POSTGRES_PASSWORD: orkestr_secret
    DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
  script:
    - cd back
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Критичные тесты проектора (заставка/видео во 2-м окне) — без БД
test:app-projector:
  stage: test
  image: ${NODE_IMAGE}
  script:
    - cd app
    - npm run test:projector
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Общий SSH-доступ к VPS (runner без DinD — сборка и деплой на хосте с Docker).
.deploy_ssh:
  image: alpine:latest
  variables:
    # compose up ждёт healthcheck back/bot без вывода — sshd обрывает «тихую» сессию
    SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o ConnectTimeout=30"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    # SSH_PRIVATE_KEY can be either:
    # - a multiline private key string, or
    # - a GitLab "File" variable (then $SSH_PRIVATE_KEY is a path to the temp file)
    - |
      if [ -f "${SSH_PRIVATE_KEY:-}" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      else
        echo "${SSH_PRIVATE_KEY:-}" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true

# Сборка образов на VPS (тот же Docker, что и в deploy).
build:back:
  extends: .deploy_ssh
  stage: build
  script:
    - |
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} \
        "cd /opt/orchestra-back && git fetch --all --prune && git reset --hard origin/${CI_DEFAULT_BRANCH} && git clean -fd && docker compose -f docker-compose.yml build back bot"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Деплой на VPS: postgres + back + bot + dozzle
deploy:
  extends: .deploy_ssh
  stage: deploy
  needs:
    - build:back
  script:
    - |
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} "export BRANCH='${CI_DEFAULT_BRANCH}'; bash -s" <<'EOS'
      set -e
      cd /opt/orchestra-back
      git fetch --all --prune
      git reset --hard "origin/${BRANCH}"
      git clean -fd
      # --no-wait: не держим SSH, пока compose ждёт healthcheck (миграции + Nest)
      docker compose -f docker-compose.yml up -d --no-wait postgres back bot dozzle 2>/dev/null \
        || docker compose -f docker-compose.yml up -d postgres back bot dozzle
      echo "Waiting for orkestr-back health (up to 3 min)..."
      deadline=$(( $(date +%s) + 180 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' orkestr-back 2>/dev/null || echo missing)"
        echo "  orkestr-back: ${status}"
        if [ "$status" = healthy ]; then
          echo "Deploy OK: back is healthy"
          exit 0
        fi
        if [ "$status" = unhealthy ]; then
          echo "orkestr-back is unhealthy — recent logs:"
          docker logs --tail 80 orkestr-back 2>&1 || true
          exit 1
        fi
        sleep 5
      done
      echo "Timeout waiting for orkestr-back — recent logs:"
      docker logs --tail 80 orkestr-back 2>&1 || true
      exit 1
      EOS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
