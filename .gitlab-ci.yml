# CI/CD для GitLab (сервер: API + БД). Клиент «Оркестр» — в отдельном репозитории.

stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"

# Кэш node_modules
default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - back/node_modules/

# Линт бэкенда
lint:back:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - cd back
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Тесты бэкенда
test:back:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: dophamin_orkestr
    POSTGRES_USER: orkestr
    POSTGRES_PASSWORD: orkestr_secret
    DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
  script:
    - cd back
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Сборка Docker-образов (бэкенд)
build:back:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - cd back
    - docker build -t orkestr-back:$CI_COMMIT_SHORT_SHA -t orkestr-back:latest .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
# Деплой на VPS: postgres + back + bot + dozzle
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - ssh -o StrictHostKeyChecking=accept-new root@${DEPLOY_HOST} "cd /opt/orchestra-back && git fetch --all --prune && git reset --hard origin/${CI_DEFAULT_BRANCH} && git clean -fd && docker compose up -d --build postgres back bot dozzle"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DEPLOY_HOST: "213.226.126.196"
