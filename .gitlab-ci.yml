# CI/CD для GitLab
# Сборка бэкенда, линт, тесты; опционально — деплой

stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "22"

# Кэш node_modules
default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - back/node_modules/
      - electron-vite-project/node_modules/

# Линт бэкенда
lint:back:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - cd back
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Линт фронта (Electron)
lint:front:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - cd electron-vite-project
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Тесты бэкенда
test:back:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: dophamin_orkestr
    POSTGRES_USER: orkestr
    POSTGRES_PASSWORD: orkestr_secret
    DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
  script:
    - cd back
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Сборка Docker-образов (бэкенд)
build:back:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - cd back
    - docker build -t orkestr-back:$CI_COMMIT_SHORT_SHA -t orkestr-back:latest .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
