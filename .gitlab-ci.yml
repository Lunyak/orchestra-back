# CI/CD для GitLab (сервер: API + БД). Клиент «Оркестр» — в отдельном репозитории.

stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DEP_PROXY: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
  NODE_IMAGE: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_VERSION}-alpine"
  POSTGRES_IMAGE: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:16-alpine"
  DEPLOY_HOST: "213.226.126.196"
  DEPLOY_REPO_SYNC: "cd /opt/orchestra-back && git fetch --all --prune && git reset --hard origin/${CI_DEFAULT_BRANCH} && git clean -fd"
  # Иначе job/service часто в разных сетях: health-check timeout + Prisma P1001 на postgres:5432
  FF_NETWORK_PER_BUILD: "true"

# Кэш node_modules
default:
  tags:
    - orchestra
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - back/node_modules/

# Ждём TCP postgres:5432 (node alpine без pg_isready).
.wait_for_postgres: &wait_for_postgres |
  echo "Waiting for postgres:5432..."
  node <<'NODE'
  const net = require('net');
  const host = 'postgres';
  const port = 5432;
  const deadline = Date.now() + 90_000;
  function tryOnce() {
    return new Promise((resolve) => {
      const socket = net.connect({ host, port }, () => {
        socket.end();
        resolve(true);
      });
      socket.on('error', () => resolve(false));
      socket.setTimeout(2000, () => {
        socket.destroy();
        resolve(false);
      });
    });
  }
  (async () => {
    while (Date.now() < deadline) {
      if (await tryOnce()) {
        console.log('postgres is accepting connections');
        process.exit(0);
      }
      await new Promise((r) => setTimeout(r, 1000));
    }
    console.error('Timed out waiting for postgres:5432');
    process.exit(1);
  })();
  NODE

# Тот же tsc, что Docker web (npm run build). Ловит ошибки фронта до VPS rebuild.
typecheck:web:
  stage: lint
  image: ${NODE_IMAGE}
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - app/node_modules/
      - web/node_modules/
  script:
    - cd app && npm ci && npm run typecheck
    - cd ../web && npm ci && npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Линт бэкенда
lint:back:
  stage: lint
  image: ${NODE_IMAGE}
  script:
    - cd back
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Тесты бэкенда
test:back:
  stage: test
  image: ${NODE_IMAGE}
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
    POSTGRES_DB: dophamin_orkestr
    POSTGRES_USER: orkestr
    POSTGRES_PASSWORD: orkestr_secret
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
  script:
    - cd back
    - npm ci
    - *wait_for_postgres
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Все миграции с нуля на чистой Postgres — гейт до build/deploy на master.
# Ловит битые SQL (нет enum/таблицы), которые иначе падают уже на хосте.
test:migrations:
  stage: test
  image: ${NODE_IMAGE}
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
    POSTGRES_DB: dophamin_orkestr
    POSTGRES_USER: orkestr
    POSTGRES_PASSWORD: orkestr_secret
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://orkestr:orkestr_secret@postgres:5432/dophamin_orkestr
  script:
    - cd back
    - npm ci
    - *wait_for_postgres
    - npx prisma generate
    - npx prisma migrate deploy
    - npx prisma migrate status
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Критичные тесты проектора (заставка/видео во 2-м окне) — без БД
test:app-projector:
  stage: test
  image: ${NODE_IMAGE}
  script:
    - cd app
    - npm run test:projector
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Общий SSH-доступ к VPS (runner без DinD — сборка и деплой на хосте с Docker).
.deploy_ssh:
  image: alpine:latest
  variables:
    # compose up ждёт healthcheck back/bot без вывода — sshd обрывает «тихую» сессию
    SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o ConnectTimeout=30"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    # SSH_PRIVATE_KEY can be either:
    # - a multiline private key string, or
    # - a GitLab "File" variable (then $SSH_PRIVATE_KEY is a path to the temp file)
    - |
      if [ -f "${SSH_PRIVATE_KEY:-}" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      else
        echo "${SSH_PRIVATE_KEY:-}" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true

# Сборка образов на VPS (тот же Docker, что и в deploy).
build:back:
  extends: .deploy_ssh
  stage: build
  needs:
    - test:migrations
    - typecheck:web
  script:
    - |
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} \
        "cd /opt/orchestra-back && git fetch --all --prune && git reset --hard origin/${CI_DEFAULT_BRANCH} && git clean -fd && docker compose -f docker-compose.yml build back bot"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Деплой на VPS: postgres + back + bot + dozzle
deploy:
  extends: .deploy_ssh
  stage: deploy
  needs:
    - build:back
    - typecheck:web
  script:
    - |
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} "export BRANCH='${CI_DEFAULT_BRANCH}'; bash -s" <<'EOS'
      set -e
      cd /opt/orchestra-back
      git fetch --all --prune
      git reset --hard "origin/${BRANCH}"
      git clean -fd

      dump_back_logs() {
        echo "——— orkestr-back logs (tail 120) ———"
        docker logs --tail 120 orkestr-back 2>&1 || true
        echo "——— end logs ———"
      }

      # want_health=1 → только healthy; иначе healthy|running
      wait_container() {
        name="$1"
        want_health="$2"
        deadline=$(( $(date +%s) + 180 ))
        while [ "$(date +%s)" -lt "$deadline" ]; do
          status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$name" 2>/dev/null || echo missing)"
          echo "  ${name}: ${status}"
          if [ "$want_health" = "1" ]; then
            [ "$status" = healthy ] && return 0
          else
            [ "$status" = healthy ] || [ "$status" = running ] && return 0
          fi
          if [ "$status" = unhealthy ]; then
            echo "${name} is unhealthy"
            return 1
          fi
          sleep 5
        done
        echo "Timeout waiting for ${name}"
        return 1
      }

      # Не ждём health через compose (тихий SSH + обрезанные логи). Поднимаем по шагам.
      docker compose -f docker-compose.yml up -d postgres
      echo "Waiting for orkestr-postgres..."
      wait_container orkestr-postgres 1 || exit 1

      docker compose -f docker-compose.yml up -d --no-deps back
      echo "Waiting for orkestr-back health (up to 3 min)..."
      if ! wait_container orkestr-back 1; then
        dump_back_logs
        exit 1
      fi
      echo "Deploy OK: back is healthy"

      docker compose -f docker-compose.yml up -d --no-deps bot dozzle
      EOS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
